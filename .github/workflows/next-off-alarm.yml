name: Next Off Alarm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euxo pipefail
          test -f NextOffAlarm-source.zip
          echo "=== ZIP SHA256 ==="
          sha256sum NextOffAlarm-source.zip
          echo "=== ZIP CONTENTS ==="
          unzip -l NextOffAlarm-source.zip | head -80

      - name: Extract exactly one source ZIP
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/next-off-alarm-src"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -q NextOffAlarm-source.zip -d "$SRC"

          test -f "$SRC/settings.gradle"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/java/jp/groovy/todayoffalarm/AlarmEditActivity.java"

          echo "=== BUILD VERSION ==="
          grep -n "versionCode\|versionName" "$SRC/app/build.gradle"

          echo "=== SOURCE MARKERS ==="
          grep -n "一度だけ使用" "$SRC/app/src/main/java/jp/groovy/todayoffalarm/AlarmEditActivity.java"
          grep -n "アラーム名" "$SRC/app/src/main/java/jp/groovy/todayoffalarm/AlarmEditActivity.java"
          grep -n "アラームの停止スケジュール" "$SRC/app/src/main/java/jp/groovy/todayoffalarm/AlarmEditActivity.java"

          echo "PROJECT_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean and build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail
          rm -rf .gradle app/build build
          gradle --no-daemon --no-build-cache clean assembleDebug
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Next Off Alarm APK
        uses: actions/upload-artifact@v4
        with:
          name: NextOffAlarm-debug-v1.0.2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
